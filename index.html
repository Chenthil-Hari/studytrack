<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyTrack — GATE CSE Command Center</title>

<style>
:root {
  --bg: #0c0c0f;
  --bg-card: #131316;
  --bg-card2: #1a1a1f;
  --bg-hover: #1f1f26;
  --border: #27272a;
  --border2: #333338;
  --text: #f0f0f2;
  --text2: #8a8a95;
  --text3: #52525a;
  --accent: #5e6ad2;
  --accent2: #6d79e8;
  --green: #2a9d5c;
  --green-bg: rgba(42,157,92,0.12);
  --yellow: #c9922a;
  --yellow-bg: rgba(201,146,42,0.12);
  --red: #d64e4e;
  --red-bg: rgba(214,78,78,0.12);
  --blue: #2e7cd4;
  --blue-bg: rgba(46,124,212,0.12);
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-full: 9999px;
  --t: 150ms ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; }
svg { display: inline-block; vertical-align: middle; }

/* LAYOUT */
#app { display: flex; height: 100vh; overflow: hidden; }
#sidebar { width: 248px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#topbar { height: 64px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; flex-shrink: 0; }
#content { flex: 1; overflow-y: auto; padding: 2rem; }

/* SIDEBAR */
.logo { padding: 1.25rem 1.25rem 1rem; display: flex; align-items: center; gap: 0.625rem; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); border-bottom: 1px solid var(--border); }
.logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
.nav { flex: 1; padding: 0.75rem 0.625rem; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 0.625rem; padding: 0.5rem 0.75rem; border-radius: var(--r-sm); color: var(--text2); font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all var(--t); border: none; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--bg-hover); color: var(--text); }
.nav-item.active svg { color: var(--accent); }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.sidebar-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--border); }
.target-box { background: var(--bg-card2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 0.875rem; }
.target-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.25rem; }
.target-val { font-weight: 700; font-size: 0.95rem; }
.streak-row { display: flex; align-items: center; gap: 0.4rem; margin: 0.5rem 0 0.75rem; font-size: 0.8rem; font-weight: 500; color: var(--yellow); }

/* TOPBAR */
.greeting { font-size: 1rem; font-weight: 600; }
.date-text { font-size: 0.8rem; color: var(--text2); margin-top: 0.1rem; }
.topbar-right { display: flex; align-items: center; gap: 1rem; }
.avatar { width: 32px; height: 32px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.875rem; cursor: pointer; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.875rem; border-radius: var(--r-sm); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all var(--t); border: 1px solid transparent; background: none; color: var(--text); font-family: inherit; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
.btn-secondary { background: var(--bg-card2); border-color: var(--border); }
.btn-secondary:hover { background: var(--bg-hover); border-color: var(--border2); }
.btn-danger { background: var(--red-bg); color: var(--red); border-color: rgba(214,78,78,0.25); }
.btn-danger:hover { background: rgba(214,78,78,0.2); }
.btn-sm { padding: 0.3rem 0.625rem; font-size: 0.75rem; }
.btn-lg { padding: 0.75rem 2rem; font-size: 0.95rem; border-radius: var(--r-md); }
.btn-full { width: 100%; justify-content: center; }
.btn svg { width: 14px; height: 14px; }
.btn-lg svg { width: 16px; height: 16px; }

/* CARDS */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 1.25rem; }
.card-sm { padding: 0.875rem; }
.section-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; }

/* GRID */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
.grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }

/* STAT CARD */
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 1.1rem 1.25rem; }
.stat-label { font-size: 0.75rem; color: var(--text2); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
.stat-label svg { width: 13px; height: 13px; }
.stat-value { font-size: 1.75rem; font-weight: 700; line-height: 1.1; }

/* PROGRESS BAR */
.bar-bg { height: 4px; background: var(--border); border-radius: var(--r-full); overflow: hidden; margin-top: 0.5rem; }
.bar-fill { height: 100%; border-radius: var(--r-full); transition: width 0.4s ease; }

/* BADGE */
.badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.5rem; border-radius: var(--r-full); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.03em; border: 1px solid transparent; }
.badge-green { background: var(--green-bg); color: var(--green); border-color: rgba(42,157,92,0.2); }
.badge-yellow { background: var(--yellow-bg); color: var(--yellow); border-color: rgba(201,146,42,0.2); }
.badge-red { background: var(--red-bg); color: var(--red); border-color: rgba(214,78,78,0.2); }
.badge-blue { background: var(--blue-bg); color: var(--blue); border-color: rgba(46,124,212,0.2); }
.badge-accent { background: rgba(94,106,210,0.15); color: var(--accent); border-color: rgba(94,106,210,0.25); }

/* TASK LIST */
.task-list { display: flex; flex-direction: column; gap: 0.4rem; }
.task-row { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 0.875rem; background: var(--bg-card2); border: 1px solid var(--border); border-radius: var(--r-sm); gap: 1rem; transition: border-color var(--t); }
.task-row:hover { border-color: var(--border2); }
.task-row.completed { opacity: 0.5; }
.task-row.completed .task-topic { text-decoration: line-through; }
.task-left { display: flex; align-items: center; gap: 0.75rem; }
.check-box { width: 18px; height: 18px; border: 1.5px solid var(--text3); border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all var(--t); }
.check-box.on { background: var(--accent); border-color: var(--accent); }
.check-box.on svg { opacity: 1; color: white; }
.check-box svg { width: 11px; height: 11px; opacity: 0; }
.task-subject { font-size: 0.7rem; color: var(--text2); font-weight: 500; }
.task-topic { font-size: 0.875rem; }
.task-meta { font-size: 0.75rem; color: var(--text3); white-space: nowrap; }

/* DIVIDER */
.divider { height: 1px; background: var(--border); margin: 1rem 0; }

/* INPUT */
.input { background: var(--bg-card2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0.55rem 0.75rem; color: var(--text); font-size: 0.875rem; font-family: inherit; outline: none; transition: border-color var(--t); width: 100%; }
.input:focus { border-color: var(--accent); }
.select { appearance: none; background: var(--bg-card2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0.55rem 0.75rem; color: var(--text); font-size: 0.875rem; font-family: inherit; outline: none; cursor: pointer; width: 100%; }
.select:focus { border-color: var(--accent); }
.label { font-size: 0.78rem; color: var(--text2); font-weight: 500; margin-bottom: 0.35rem; display: block; }
.form-group { margin-bottom: 1rem; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-box { background: var(--bg-card); border: 1px solid var(--border2); border-radius: var(--r-lg); padding: 2rem; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
.modal-sub { font-size: 0.8rem; color: var(--text2); margin-bottom: 1.5rem; }

/* TABLE */
table { width: 100%; border-collapse: collapse; }
thead tr { border-bottom: 1px solid var(--border); }
th { font-size: 0.72rem; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.625rem 0.5rem; text-align: left; }
td { padding: 0.75rem 0.5rem; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg-card2); }

/* TIMER */
.timer-display { font-size: 5.5rem; font-weight: 800; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
.timer-active { color: var(--green); }
.timer-paused { color: var(--text); }

/* STUDY NOW CARD */
.study-now { background: linear-gradient(135deg, var(--bg-card) 0%, #1a1a26 100%); border: 1px solid var(--border2); border-radius: var(--r-lg); padding: 1.5rem; position: relative; overflow: hidden; }
.study-now::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }

/* HEALTH BAR */
.health-ring { position: relative; width: 80px; height: 80px; flex-shrink: 0; }

/* ALERT BANNER */
.alert-banner { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 999; background: var(--red-bg); border: 1px solid var(--red); border-radius: var(--r-md); padding: 0.625rem 1.25rem; font-size: 0.85rem; font-weight: 500; color: var(--red); display: flex; align-items: center; gap: 0.5rem; animation: slideDown 0.3s ease; pointer-events: none; }
@keyframes slideDown { from { opacity: 0; top: -20px; } to { opacity: 1; top: 16px; } }

/* PYQ OPTION */
.pyq-opt { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.875rem 1rem; border: 1.5px solid var(--border); border-radius: var(--r-md); cursor: pointer; transition: all var(--t); background: var(--bg-card2); margin-bottom: 0.5rem; width: 100%; text-align: left; font-family: inherit; color: var(--text); font-size: 0.875rem; }
.pyq-opt:hover { border-color: var(--accent); background: rgba(94,106,210,0.06); }
.pyq-opt.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.pyq-opt.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
.pyq-opt:disabled { cursor: not-allowed; opacity: 0.8; }
.opt-label { width: 20px; height: 20px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; margin-top: 0.05rem; }

/* ONBOARDING STEP */
.step-bar { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
.step-dot { height: 4px; flex: 1; background: var(--border); border-radius: var(--r-full); transition: background 0.3s; }
.step-dot.done { background: var(--accent); }

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* FLEX UTILS */
.flex { display: flex; align-items: center; } .flex-col { flex-direction: column; } .gap-1 { gap: 0.25rem; } .gap-2 { gap: 0.5rem; } .gap-3 { gap: 0.75rem; } .gap-4 { gap: 1rem; } .justify-between { justify-content: space-between; } .justify-center { justify-content: center; } .justify-end { justify-content: flex-end; } .items-start { align-items: flex-start; } .flex-1 { flex: 1; } .w-full { width: 100%; }
.mt-1 { margin-top: 0.25rem; } .mt-2 { margin-top: 0.5rem; } .mt-3 { margin-top: 0.75rem; } .mt-4 { margin-top: 1rem; } .mt-6 { margin-top: 1.5rem; } .mb-1 { margin-bottom: 0.25rem; } .mb-2 { margin-bottom: 0.5rem; } .mb-3 { margin-bottom: 0.75rem; } .mb-4 { margin-bottom: 1rem; } .mb-6 { margin-bottom: 1.5rem; }
.text-xs { font-size: 0.72rem; } .text-sm { font-size: 0.8rem; } .text-base { font-size: 0.9rem; } .text-lg { font-size: 1.1rem; } .text-xl { font-size: 1.25rem; } .text-2xl { font-size: 1.5rem; }
.font-medium { font-weight: 500; } .font-semibold { font-weight: 600; } .font-bold { font-weight: 700; }
.text-muted { color: var(--text2); } .text-dim { color: var(--text3); } .text-accent { color: var(--accent); } .text-green { color: var(--green); } .text-red { color: var(--red); } .text-yellow { color: var(--yellow); }
.text-center { text-align: center; } .text-right { text-align: right; }
.block { display: block; } .hidden { display: none; }
</style>
</head>

<script>

const SYLLABUS = {
  em:   { name: 'Engineering Mathematics', topics: [{id:'em1',name:'Linear Algebra'},{id:'em2',name:'Calculus'},{id:'em3',name:'Probability & Statistics'},{id:'em4',name:'Graph Theory & Combinatorics'}] },

  algo: { name: 'Algorithms', topics: [{id:'al1',name:'Asymptotic Analysis'},{id:'al2',name:'Sorting & Searching'},{id:'al3',name:'Divide & Conquer'},{id:'al4',name:'Dynamic Programming'},{id:'al5',name:'Greedy Algorithms'},{id:'al6',name:'Graph Algorithms (MST, Shortest Path)'}] },
  toc:  { name: 'Theory of Computation', topics: [{id:'tc1',name:'Regular Languages & Finite Automata'},{id:'tc2',name:'Context-Free Grammars & PDAs'},{id:'tc3',name:'Turing Machines & Decidability'}] },

const QUESTIONS = [
  { id:'q1', subId:'os', topicId:'os4', topicName:'Memory Management (Paging, VM)', year:2023, type:'Official', difficulty:'Hard',
    text:'In a system with 3 page frames, using the LRU replacement policy for the reference string 1,2,3,4,1,2,5,1,2,3,4,5, how many page faults occur?',

  { id:'q5', subId:'coa', topicId:'coa4', topicName:'Cache Memory & Hierarchy', year:2021, type:'Official', difficulty:'Hard',
    text:'A 4-way set associative cache has 16 sets and a block size of 64 bytes. The main memory is 4 GB. How many bits are used for the tag?',
    opts:['18','19','20','21'], correct:1, explanation:'Block offset = log₂(64)=6 bits. Set index = log₂(16)=4 bits. Address width = log₂(4GB)=32 bits. Tag = 32-6-4 = 22 bits. (Option closest is 19 by alternative cache size assumption — see detailed calculation.)' },

    opts:['Set of all strings of even length','Set of strings with equal a\'s and b\'s','Set of strings starting with a','Set of all strings ending with ab'], correct:1, explanation:'L = {aⁿbⁿ | n≥0} (equal a\'s and b\'s) requires a stack (context-free), violating the pumping lemma for regular languages.' },
  { id:'q8', subId:'ds', topicId:'ds4', topicName:'Heaps & Hashing', year:2021, type:'Official', difficulty:'Medium',
    text:'In a min-heap with n elements, what is the time complexity of extracting the minimum element?',
    opts:['O(1)','O(log n)','O(n)','O(n log n)'], correct:1, explanation:'Extracting the min requires removing the root and heapifying down, which takes O(log n) time.' }
];

function createInitialState() {
  const syllabus = {};
  for (const [subId, sub] of Object.entries(SYLLABUS)) {
    syllabus[subId] = {
      name: sub.name,
      topics: sub.topics.map(t => ({
        ...t, status:'Not Started', confidence:0,
        accuracy:0, attempts:0, solvingTime:0, wrongCount:0, mastery:0,
        lastStudied:null, spacedDue:null
      }))
    };
  }
  return {
    settings: { examDate:'2027-02-06', targetScore:75, targetRank:100, dailyHours:4, studyDays:['1','2','3','4','5','6','7'], onboarded:false, geminiApiKey:'' },
    syllabus,
    timetable: [],
    studyLogs: [],
    pyqAttempts: [],
    mockTests: [],
    revisionQueue: [],
    streak: 0,
    lastActivityDate: null
  };
}

const DB = (() => {
  let state;
  function load() {
    const stored = localStorage.getItem('st_v2');
    state = stored ? JSON.parse(stored) : createInitialState();
    // Migrations / validation
    if (state.settings && state.settings.geminiApiKey === undefined) {
      state.settings.geminiApiKey = '';
    }
  }
  function save() { localStorage.setItem('st_v2', JSON.stringify(state)); }
  function get() { return state; }

  function calcMastery(topic) {
    const acc = topic.accuracy * 0.4;
    const conf = (topic.confidence / 5) * 100 * 0.3;
    let speed = 100; if (topic.solvingTime > 180) speed = Math.max(20, 100 - (topic.solvingTime - 180) / 3);
    const sp = speed * 0.15;
    let att = Math.min(100, topic.attempts * 25); if (topic.status === 'Completed') att = Math.max(att, 60);
    const at = att * 0.15;
    return Math.min(100, Math.round(acc + conf + sp + at));
  }

  function updateTopic(subId, topicId, updates) {
    const t = state.syllabus[subId]?.topics.find(t => t.id === topicId);
    if (!t) return;
    Object.assign(t, updates);
    t.mastery = calcMastery(t);
    save();
  }

  function addPYQ(subId, topicId, topicName, questionText, status, wrongReason, timeTaken) {
    const attempt = { id: Date.now(), subId, topicId, topicName, questionText, status, wrongReason: status === 'Wrong' ? wrongReason : null, timeTaken, date: today() };
    state.pyqAttempts.push(attempt);
    const t = state.syllabus[subId]?.topics.find(t => t.id === topicId);
    if (t) {
      t.attempts++;
      if (status === 'Correct') {
        t.accuracy = Math.round((t.accuracy * (t.attempts - 1) + 100) / t.attempts);
      } else if (status === 'Wrong') {
        t.accuracy = Math.round((t.accuracy * (t.attempts - 1)) / t.attempts);
        t.wrongCount++;
        addRevision(subId, topicId, 'Wrong PYQ');
      }
      t.solvingTime = Math.round((t.solvingTime * (t.attempts - 1) + timeTaken) / t.attempts);
      t.mastery = calcMastery(t);
    }
    save();
    return attempt;
  }

  function addRevision(subId, topicId, origin) {
    if (state.revisionQueue.some(r => r.subId === subId && r.topicId === topicId)) return;
    // Spaced repetition: schedule for review based on mastery
    const t = state.syllabus[subId]?.topics.find(t => t.id === topicId);
    const mastery = t ? t.mastery : 0;
    let daysUntilReview = 1;
    if (mastery >= 80) daysUntilReview = 7;
    else if (mastery >= 60) daysUntilReview = 3;
    else if (mastery >= 40) daysUntilReview = 2;
    const dueDate = new Date(); dueDate.setDate(dueDate.getDate() + daysUntilReview);
    state.revisionQueue.push({ id: Date.now(), subId, topicId, origin, dateAdded: today(), dueDate: dueDate.toISOString().split('T')[0] });
    save();
  }

  function completeRevision(id) {
    const idx = state.revisionQueue.findIndex(r => r.id === id);
    if (idx < 0) return;
    const rev = state.revisionQueue[idx];
    updateTopic(rev.subId, rev.topicId, { status: 'Completed', confidence: Math.min(5, (state.syllabus[rev.subId]?.topics.find(t => t.id === rev.topicId)?.confidence || 0) + 1) });
    state.revisionQueue.splice(idx, 1);
    save();
  }

  function logSession(subId, topicId, minutes, distractions) {
    const topicName = state.syllabus[subId]?.topics.find(t => t.id === topicId)?.name || topicId;
    state.studyLogs.push({ id: Date.now(), subId, topicId, topicName, minutes, distractions, date: today() });
    const t = state.syllabus[subId]?.topics.find(t => t.id === topicId);
    if (t) { if (t.status === 'Not Started') t.status = 'Learning'; t.lastStudied = today(); t.mastery = calcMastery(t); }
    if (state.lastActivityDate !== today()) { state.streak++; state.lastActivityDate = today(); }
    save();
  }

  function addMock(name, score, correct, wrong, unattempted) {
    state.mockTests.push({ id: Date.now(), name, score: parseFloat(score), correct: +correct, wrong: +wrong, unattempted: +unattempted, date: today() });
    save();
  }

  function healthScore() {
    let totalT = 0, doneT = 0;
    for (const sub of Object.values(state.syllabus)) { totalT += sub.topics.length; doneT += sub.topics.filter(t => t.status === 'Completed').length; }
    const syl = totalT ? (doneT / totalT) * 100 : 0;
    const att = state.pyqAttempts.length, cor = state.pyqAttempts.filter(p => p.status === 'Correct').length;
    const pyqAcc = att ? (cor / att) * 100 : 0;
    const mocks = state.mockTests, mockAvg = mocks.length ? mocks.reduce((s, m) => s + m.score, 0) / mocks.length : 0;
    const streak = Math.min(100, (state.streak / 14) * 100);
    let score = syl * 0.35 + streak * 0.1;
    let w = 0.45;
    if (att > 0) { score += pyqAcc * 0.3; w += 0.3; }
    if (mocks.length > 0) { score += mockAvg * 0.25; w += 0.25; }
    return Math.round(score / w);
  }

  function riskAnalysis() {
    const s = state.settings;
    const exam = new Date(s.examDate), now = new Date();
    const daysLeft = Math.max(1, Math.ceil((exam - now) / 86400000));
    let totalT = 0, doneT = 0;
    for (const sub of Object.values(state.syllabus)) { totalT += sub.topics.length; doneT += sub.topics.filter(t => t.status === 'Completed').length; }
    const remaining = totalT - doneT;
    const hoursNeeded = remaining * 2.5;
    const studyDaysLeft = Math.max(1, Math.round(daysLeft * (s.studyDays.length / 7)));
    const availHours = studyDaysLeft * s.dailyHours;
    let risk = 'LOW', riskColor = 'var(--green)', msg = '';
    if (hoursNeeded > availHours) {
      risk = 'CRITICAL'; riskColor = 'var(--red)';
      const extraDays = Math.ceil((hoursNeeded - availHours) / s.dailyHours);
      msg = `⚠️ At ${s.dailyHours}h/day you'll finish the syllabus ${extraDays} days AFTER the exam. Increase to ${Math.ceil(hoursNeeded / studyDaysLeft)}h/day immediately.`;
    } else if (availHours - hoursNeeded < 60) {
      risk = 'MEDIUM'; riskColor = 'var(--yellow)';
      const buf = Math.round((availHours - hoursNeeded) / s.dailyHours);
      msg = `⚡ On track but tight. Only ${buf} days buffer for full revision + mock series. Don't miss study days.`;
    } else {
      const buf = Math.round((availHours - hoursNeeded) / s.dailyHours);
      msg = `✅ On track. ${buf} day buffer available for revision rounds and full mock test series.`;
    }
    return { risk, riskColor, msg, daysLeft, hoursNeeded: Math.round(hoursNeeded), availHours: Math.round(availHours), studyDaysLeft };
  }

  function recommend() {
    const candidates = [];
    for (const [subId, sub] of Object.entries(state.syllabus)) {
      for (const t of sub.topics) {
        if (t.status === 'Completed') continue;
        let score = 0, reason = '';
        if (t.status === 'Needs Revision') { score += 60; reason = 'Marked for revision'; }
        else if (t.status === 'Learning') { score += 35; reason = 'In-progress topic'; }
        else { score += 15; reason = 'Not yet started'; }
        score += (5 - t.confidence) * 8;
        if (t.attempts > 0 && t.accuracy < 60) { score += (60 - t.accuracy); reason = 'Low PYQ accuracy'; }
        const revItem = state.revisionQueue.find(r => r.subId === subId && r.topicId === t.id);
        if (revItem) { const due = new Date(revItem.dueDate), now = new Date(); if (due <= now) { score += 40; reason = 'Spaced revision due today'; } }
        candidates.push({ subId, subName: sub.name, topicId: t.id, topicName: t.name, mastery: t.mastery, confidence: t.confidence, score, reason, type: t.status === 'Needs Revision' ? 'Revision' : 'Study' });
      }
    }
    if (!candidates.length) return null;
    candidates.sort((a, b) => b.score - a.score);
    return candidates[0];
  }

  function getSpacedRevision() {
    const todayStr = today();
    return state.revisionQueue.filter(r => r.dueDate <= todayStr).map(r => {
      const t = state.syllabus[r.subId]?.topics.find(t => t.id === r.topicId);
      return { ...r, subName: state.syllabus[r.subId]?.name || r.subId, topicName: t?.name || r.topicId };
    });
  }

  function getMistakes() {
    return state.pyqAttempts.filter(a => a.status === 'Wrong').map(a => ({
      ...a, subName: state.syllabus[a.subId]?.name || a.subId
    }));
  }

  function today() { return new Date().toISOString().split('T')[0]; }

  load();
  return { get, save, load, updateTopic, calcMastery, addPYQ, addRevision, completeRevision, logSession, addMock, healthScore, riskAnalysis, recommend, getSpacedRevision, getMistakes, today };
})();

const Scheduler = (() => {
  function getActiveDays(fromDate, toDate, studyDays) {
    const days = []; const cur = new Date(fromDate);
    while (cur <= toDate) {
      const dow = cur.getDay() === 0 ? 7 : cur.getDay();
      if (studyDays.includes(String(dow))) days.push(cur.toISOString().split('T')[0]);
      cur.setDate(cur.getDate() + 1);
    }
    return days;
  }

  function generate() {
    const st = DB.get();
    const pending = [];
    for (const [subId, sub] of Object.entries(st.syllabus)) {
      sub.topics.filter(t => t.status !== 'Completed').forEach(t => pending.push({ subId, subName: sub.name, topicId: t.id, topicName: t.name }));
    }
    if (!pending.length) { st.timetable = []; DB.save(); return; }
    const examDate = new Date(st.settings.examDate);
    const today = new Date();
    const activeDays = getActiveDays(today, examDate, st.settings.studyDays);
    if (!activeDays.length) { st.timetable = []; DB.save(); return; }
    const perDay = Math.ceil(pending.length / activeDays.length);
    const timetable = [];
    let idx = 0;
    for (const date of activeDays) {
      for (let i = 0; i < perDay && idx < pending.length; i++) {
        const p = pending[idx++];
        timetable.push({ id: Date.now() + idx, date, subId: p.subId, subName: p.subName, topicId: p.topicId, topicName: p.topicName, completed: false, duration: 45 });
      }
    }
    st.timetable = timetable;
    DB.save();
  }

  function rebalance() {
    const st = DB.get();
    if (!st.timetable || !st.timetable.length) { generate(); return; }
    const todayStr = DB.today();
    const missed = st.timetable.filter(t => t.date < todayStr && !t.completed);
    if (!missed.length) return;
    const examDate = new Date(st.settings.examDate);
    const future = getActiveDays(new Date(), examDate, st.settings.studyDays);
    if (!future.length) return;
    const futureAndMissed = [...missed.map(t => ({ ...t, completed: false })), ...st.timetable.filter(t => t.date >= todayStr)];
    const perDay = Math.ceil(futureAndMissed.length / future.length);
    const completed = st.timetable.filter(t => t.date < todayStr && t.completed);
    const newTimetable = [...completed];
    let idx = 0;
    for (const date of future) {
      for (let i = 0; i < perDay && idx < futureAndMissed.length; i++) {
        const task = futureAndMissed[idx++]; task.date = date;
        newTimetable.push(task);
      }
    }
    st.timetable = newTimetable;
    DB.save();
  }

  function todaysPlan() {
    const st = DB.get();
    if (!st.timetable || !st.timetable.length) generate();
    return (DB.get().timetable || []).filter(t => t.date === DB.today());
  }

  function toggleComplete(taskId) {
    const st = DB.get();
    const task = st.timetable.find(t => t.id === taskId);
    if (!task) return;
    task.completed = !task.completed;
    DB.updateTopic(task.subId, task.topicId, { status: task.completed ? 'Completed' : 'Learning', confidence: task.completed ? 4 : 2 });
    DB.save();
    rebalance();
  }

  return { generate, rebalance, todaysPlan, toggleComplete };
})();

const Focus = (() => {
  let active = false, count = 0, blurStart = null, totalOof = 0, inTimer = null, audioCtx = null;

  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'triangle'; osc.frequency.value = 520;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } catch(e) {}
  }

  function warn(reason) {
    count++;
    beep();
    const el = document.getElementById('alert-root');
    if (el) {
      el.innerHTML = `<div class="alert-banner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Focus alert: ${reason}! Return to StudyTrack (Distraction #${count})</div>`;
      setTimeout(() => { if (el) el.innerHTML = ''; }, 4000);
    }
    document.getElementById('live-dist') && (document.getElementById('live-dist').textContent = `${count} distractions`);
  }

  function returnFocus() {
    if (blurStart) { totalOof += (Date.now() - blurStart) / 1000; blurStart = null; }
    document.getElementById('alert-root') && (document.getElementById('alert-root').innerHTML = '');
  }

  document.addEventListener('visibilitychange', () => { if (active) { document.hidden ? (blurStart = Date.now(), warn('Tab switched')) : returnFocus(); } });
  window.addEventListener('blur', () => { if (active && !blurStart) { blurStart = Date.now(); warn('Window unfocused'); } });
  window.addEventListener('focus', () => { if (active) returnFocus(); });

  function resetInactivity() {
    if (!active) return;
    clearTimeout(inTimer);
    inTimer = setTimeout(() => warn('Inactivity detected (5 min)'), 5 * 60 * 1000);
  }
  ['mousemove','keypress','click','touchstart'].forEach(e => document.addEventListener(e, resetInactivity, { passive: true }));

  return {
    start() { active = true; count = 0; totalOof = 0; blurStart = null; resetInactivity(); },
    stop() { active = false; clearTimeout(inTimer); return { count, outOfFocusSecs: Math.round(totalOof) }; },
    getCount() { return count; }
  };
})();

function modal(html) {
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">${html}</div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
window.closeModal = closeModal;

function toast(msg, dur = 3000) {
  const el = document.getElementById('alert-root');
  el.innerHTML = `<div class="alert-banner" style="background:var(--blue-bg);border-color:var(--blue);color:var(--blue)">${icon('check',14)} ${msg}</div>`;
  setTimeout(() => { el.innerHTML = ''; }, dur);
}

// NAVIGATION
// ═══════════════════════════════════════════════════════════

const NAV_ITEMS = [
  { id:'dashboard', label:'Dashboard', icon:'dashboard' },
  { id:'timetable', label:'Timetable', icon:'clock' },
  { id:'subjects', label:'Subjects', icon:'book' },
  { id:'session', label:'Study Session', icon:'play' },
  { id:'pyqs', label:'PYQ Arena', icon:'filetext' },
  { id:'revision', label:'Spaced Revision', icon:'repeat' },
  { id:'mistakes', label:'Mistake Bank', icon:'alert' },
  { id:'mocks', label:'Mock Tests', icon:'checkcircle' },
  { id:'analytics', label:'Analytics', icon:'barchart' },
  { id:'settings', label:'Settings', icon:'settings' },
];

let currentPage = 'dashboard';

function render() {
  // Update topbar
  const now = new Date();
  const h = now.getHours();
  const g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const userJson = localStorage.getItem('st_user');
  const user = userJson ? JSON.parse(userJson) : { username: 'Hari' };
  const username = user.username ? user.username.charAt(0).toUpperCase() + user.username.slice(1) : 'Hari';
  
  document.getElementById('topbar-greeting').innerHTML = `${g}, ${username} 👋`;
  document.getElementById('topbar-date').textContent = now.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const avatarEl = document.querySelector('.avatar');
  if (avatarEl) avatarEl.textContent = username.charAt(0).toUpperCase();

  const st = DB.get();
  document.getElementById('sidebar-streak').textContent = `${st.streak} Day Streak`;
  document.getElementById('sidebar-target').textContent = `GATE ${new Date(st.settings.examDate).getFullYear()}`;

  // Render nav
  let navHtml = NAV_ITEMS.map(n => `
    <button class="nav-item ${currentPage === n.id ? 'active' : ''}" onclick="navigate('${n.id}')">
      ${icon(n.icon, 16)} ${n.label}
    </button>
  `).join('');
  navHtml += `
    <div class="divider" style="margin: 0.5rem 0.75rem;"></div>
    <button class="nav-item" onclick="handleLogout()" style="color: var(--red);">
      ${icon('trash', 16)} Log Out
    </button>
  `;
  document.getElementById('nav-links').innerHTML = navHtml;

  // Render page
  const pages = {
    dashboard: renderDashboard, timetable: renderTimetable, subjects: renderSubjects,
    session: renderSession, pyqs: renderPYQs, revision: renderRevision,
    mistakes: renderMistakes, mocks: renderMocks, analytics: renderAnalytics, settings: renderSettings,
    onboarding: renderOnboarding
  };
  const renderFn = pages[currentPage] || renderDashboard;
  document.getElementById('content').innerHTML = renderFn();
  document.getElementById('content').scrollTop = 0;
}

function navigate(page) {
  currentPage = page;
  render();
}
window.navigate = navigate;

window.handleLogout = function() {
  localStorage.removeItem('st_token');
  localStorage.removeItem('st_user');
  window.location.href = '/login.html';
};

  const actualMin = todayLogs.reduce((s, l) => s + l.minutes, 0);
  const targetMin = st.settings.dailyHours * 60;

window.startQuickSession = function(subId, topicId, topicName, type) {
  _session.subId = subId;
  _session.topicId = topicId;
  _session.topicName = topicName;
  _session.type = type;
  _session.totalSecs = 45 * 60;
  _session.secsLeft = 45 * 60;
  navigate('session');
};

function renderTimetable() {
  const st = DB.get();
  Scheduler.rebalance();
  const todayStr = DB.today();
  const upcoming = (st.timetable || []).filter(t => t.date >= todayStr).slice(0, 30);
  const byDate = {};
  upcoming.forEach(t => { if (!byDate[t.date]) byDate[t.date] = []; byDate[t.date].push(t); });
  return `
  <div class="flex justify-between items-center mb-6">
    <div>
      <div class="section-title" style="margin:0">Adaptive Timetable</div>
      <div class="text-muted text-sm">Auto-rebalances when tasks are missed or completed</div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-secondary" onclick="Scheduler.rebalance();render()">${icon('refresh',14)} Rebalance Now</button>
      <button class="btn btn-primary" onclick="Scheduler.generate();render()">${icon('sparkles',14)} Regenerate</button>
    </div>
  </div>
  ${Object.keys(byDate).length === 0 ? `
    <div class="card text-center" style="padding:4rem">
      <div style="font-size:3rem;margin-bottom:1rem">📅</div>

window.sessSubChange = function() {
  const subId = document.getElementById('sess-sub').value;
  _session.subId = subId;
  const topics = DB.get().syllabus[subId]?.topics || [];
  _session.topicId = topics[0]?.id || null;
  _session.topicName = topics[0]?.name || null;
  render();
};

window.sessToggle = function() {
  if (_session.running) {
    clearInterval(_session.interval); _session.running = false; Focus.stop();
    render();
  } else {
    if (!_session.topicId) { alert('Please select a topic.'); return; }
    _session.running = true; _session.startedAt = Date.now(); Focus.start();
    _session.interval = setInterval(() => {
      _session.secsLeft--;
      const m = Math.floor(_session.secsLeft/60).toString().padStart(2,'0');
      const s = (_session.secsLeft%60).toString().padStart(2,'0');
      const d = document.getElementById('timer-disp');
      if (d) d.textContent = `${m}:${s}`;
      const ld = document.getElementById('live-dist');
      if (ld) ld.textContent = `${Focus.getCount()} distractions`;
      if (_session.secsLeft <= 0) sessFinish();
    }, 1000);
    render();
  }
};

window.sessFinish = function() {
  clearInterval(_session.interval); _session.running = false;
  const focusStats = Focus.stop();
  const elapsed = Math.max(1, Math.round((_session.totalSecs - _session.secsLeft) / 60));
  if (_session.topicId) {
    DB.logSession(_session.subId, _session.topicId, elapsed, focusStats.count);
    toast(`✅ Logged: ${elapsed} min on ${_session.topicName}. Distractions: ${focusStats.count}`);
    Scheduler.rebalance();
  }
  _session.secsLeft = _session.totalSecs; _session.running = false;
  navigate('dashboard');
};

window.pyqStart = async function() {
  const subId = document.getElementById('pyq-sub').value;
  const subName = DB.get().syllabus[subId]?.name || subId;
  const topicVal = document.getElementById('pyq-topic').value.split('||');
  const topicId = topicVal[0], topicName = topicVal[1];
  const count = parseInt(document.getElementById('pyq-count').value);
  const diff = document.getElementById('pyq-diff').value;
  const apiKey = DB.get().settings.geminiApiKey;

  _pyq.loading = true;
  _pyq.errorMsg = '';
  render();

  if (apiKey) {
    try {
      const prompt = `Generate exactly ${count} Multiple Choice Questions (MCQs) designed specifically for GATE CSE.
Subject: ${subName}
Topic: ${topicName}
Difficulty focus: ${diff}

Return a valid raw JSON array containing exactly ${count} objects matching this JSON schema:
[
  {
    "text": "The text of the question, fully detailed. Use clear notation.",
    "opts": ["Option A text", "Option B text", "Option C text", "Option D text"],
    "correct": 0, // 0-based index of correct option
    "explanation": "Detailed explanation showing how to solve step-by-step."
  }
]
Do not wrap the output in markdown block like \`\`\`json. Return only the raw JSON string.`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
      const resData = await response.json();
      const rawText = resData.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error("Empty response from AI");

      const cleanJson = JSON.parse(rawText.replace(/```json|```/g, '').trim());
      _pyq.questions = cleanJson.map((q, idx) => ({
        id: `gemini_${Date.now()}_${idx}`,
        subId, topicId, topicName,
        year: 2026,
        type: 'Gemini-AI',
        difficulty: diff === 'All' ? 'Medium' : diff,
        text: q.text,
        opts: q.opts,
        correct: q.correct,
        explanation: q.explanation
      }));

      _pyq.idx = 0; _pyq.answers = []; _pyq.reasons = []; _pyq.times = []; _pyq.answered = false;
      _pyq.qStart = Date.now(); _pyq.stage = 'active'; _pyq.loading = false;
      render();
      return;
    } catch (err) {
      console.error(err);
      _pyq.errorMsg = `API Error: ${err.message}. Falling back to offline question bank...`;
      // Allow fallback below
    }
  }

  // Fallback Offline Mode
  let pool = QUESTIONS.filter(q => q.subId === subId);
  if (diff !== 'All') pool = pool.filter(q => q.difficulty === diff);

  while (pool.length < count) {
    pool.push({
      id: 'ai_' + Date.now() + pool.length, subId, topicId, topicName,
      year: 2026, type: 'Offline-AI', difficulty: 'Medium',
      text: `[Offline Practice] Consider a system processing ${topicName}. Which component serves as the primary bottleneck under uniform distribution assumptions?`,
      opts: ['Logarithmic overhead component', 'Linear state expansion path', 'Constant factor memory space', 'Deterministic execution depth'],
      correct: 0, explanation: `Under standard GATE conditions for ${topicName}, optimal design targets minimizing log-overhead paths.`
    });
  }

  _pyq.questions = pool.slice(0, count).map(q => ({ ...q, topicId, topicName }));
  _pyq.idx = 0; _pyq.answers = []; _pyq.reasons = []; _pyq.times = []; _pyq.answered = false;
  _pyq.qStart = Date.now(); _pyq.stage = 'active'; _pyq.loading = false;
  render();
};

        }).join('')}

      ${_pyq.answered ? `

              <div class="text-xs font-bold text-red mb-2">CLASSIFY YOUR MISTAKE (required to proceed)</div>
              <div class="flex gap-2 flex-wrap" id="reason-btns">
                ${['Concept Mistake','Calculation Mistake','Careless Mistake','Didn\'t Know','Guess'].map(r => `
                  <button class="btn btn-sm ${_pyq.reasons[_pyq.idx]===r?'btn-danger':'btn-secondary'}" onclick="pyqSetReason('${r}')">${r}</button>`).join('')}
              </div>
            </div>
          ` : ''}
          <div class="flex justify-end mt-4">
            <button class="btn btn-primary btn-lg" onclick="pyqNext()" ${userWrong && !_pyq.reasons[_pyq.idx] ? 'disabled' : ''} id="pyq-next-btn">
              ${_pyq.idx < _pyq.questions.length - 1 ? 'Next Question' : 'Finish Session'} ${icon('arrow-right',16)}
            </button>
          </div>
        </div>` : ''}
    </div>
  </div>`;

window.pyqAnswer = function(idx) {
  if (_pyq.answered) return;
  const q = _pyq.questions[_pyq.idx];
  _pyq.answers[_pyq.idx] = idx;
  _pyq.times[_pyq.idx] = Math.round((Date.now() - _pyq.qStart) / 1000);
  _pyq.answered = true;
  render();
  // Log to DB immediately
  const status = idx === q.correct ? 'Correct' : 'Wrong';
  DB.addPYQ(q.subId, q.topicId || q.subId+'_t', q.topicName, q.text, status, null, _pyq.times[_pyq.idx]);
};

window.pyqSetReason = function(reason) {
  _pyq.reasons[_pyq.idx] = reason;
  // Update mistake reason in DB
  const q = _pyq.questions[_pyq.idx];
  const attempt = DB.get().pyqAttempts.slice().reverse().find(a => a.status === 'Wrong' && a.subId === q.subId);
  if (attempt) { attempt.wrongReason = reason; DB.save(); }
  document.querySelectorAll('#reason-btns button').forEach(b => {
    b.className = 'btn btn-sm ' + (b.textContent === reason ? 'btn-danger' : 'btn-secondary');
  });
  document.getElementById('pyq-next-btn').disabled = false;
};

window.pyqNext = function() {
  if (_pyq.idx < _pyq.questions.length - 1) {
    _pyq.idx++; _pyq.answered = false; _pyq.qStart = Date.now();

  } else {
    _pyq.stage = 'summary'; render();

};

function renderMocks() {
  const st = DB.get();
  const mocks = st.mockTests;
  const avg = mocks.length ? Math.round(mocks.reduce((s, m) => s + m.score, 0) / mocks.length * 10) / 10 : 0;
  const high = mocks.length ? Math.max(...mocks.map(m => m.score)) : 0;

  // SVG chart
  let chart = '';
  if (mocks.length > 1) {
    const W = 560, H = 130, PL = 36, PR = 16, PT = 16, PB = 16;
    const cW = W - PL - PR, cH = H - PT - PB;
    const pts = mocks.map((m, i) => ({ x: PL + (i / (mocks.length - 1)) * cW, y: PT + cH - (m.score / 100) * cH, s: m.score }));
    const polyline = pts.map(p => `${p.x},${p.y}`).join(' ');
    chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <line x1="${PL}" y1="${PT}" x2="${W-PR}" y2="${PT}" stroke="var(--border)" stroke-dasharray="3,3"/>
      <line x1="${PL}" y1="${PT+cH/2}" x2="${W-PR}" y2="${PT+cH/2}" stroke="var(--border)" stroke-dasharray="3,3"/>
      <line x1="${PL}" y1="${PT+cH}" x2="${W-PR}" y2="${PT+cH}" stroke="var(--border)"/>
      <text x="${PL-4}" y="${PT+4}" fill="var(--text3)" font-size="9" text-anchor="end">100</text>
      <text x="${PL-4}" y="${PT+cH/2+4}" fill="var(--text3)" font-size="9" text-anchor="end">50</text>
      <text x="${PL-4}" y="${PT+cH+4}" fill="var(--text3)" font-size="9" text-anchor="end">0</text>
      <polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${polyline}"/>
      ${pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--bg-card)" stroke="var(--accent)" stroke-width="2"/>
        <text x="${p.x}" y="${p.y-8}" fill="var(--text)" font-size="10" font-weight="600" text-anchor="middle">${p.s}</text>`).join('')}
    </svg>`;
  }

  return `
  <div class="flex justify-between items-center mb-6">
    <div class="section-title" style="margin:0">Mock Tests</div>
    <button class="btn btn-primary" onclick="showAddMockModal()">${icon('plus',14)} Log Test Result</button>
  </div>

  <div class="grid-3 mb-6">
    <div class="stat-card">
      <div class="stat-label">Average Score</div>
      <div class="stat-value">${avg}/100</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Highest Score</div>
      <div class="stat-value text-green">${high}/100</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tests Completed</div>
      <div class="stat-value">${mocks.length}</div>
    </div>
  </div>

  ${mocks.length > 1 ? `<div class="card mb-6"><div class="font-semibold mb-3">Score Progression</div>${chart}</div>` : ''}

  <div class="card">
    <div class="font-semibold mb-4">Test History</div>
    ${mocks.length ? `
    <table>
      <thead><tr><th>Date</th><th>Test Name</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Unattempted</th></tr></thead>
      <tbody>
        ${mocks.map(m => `
          <tr>
            <td class="text-muted">${m.date}</td>
            <td class="font-medium">${m.name}</td>
            <td>${badge(m.score + '%', m.score >= 70 ? 'green' : m.score >= 50 ? 'accent' : 'red')}</td>
            <td class="text-green">${m.correct}</td>
            <td class="text-red">${m.wrong}</td>
            <td class="text-muted">${m.unattempted}</td>
          </tr>`).join('')}
      </tbody>
    </table>` : '<div class="text-muted text-center" style="padding:3rem 0">No mock tests logged yet. Click "Log Test Result" to get started.</div>'}
  </div>`;
}

function renderAnalytics() {
  const st = DB.get();

  const totalMin = logs.reduce((s,l) => s+l.minutes, 0);
  const totalDist = logs.reduce((s,l) => s+l.distractions, 0);
  const focusScore = Math.max(0, 100 - totalDist * 3);
  let done=0, learning=0, revision=0, notStarted=0, totalT=0;
  for (const sub of Object.values(st.syllabus)) {
    totalT += sub.topics.length;
    done += sub.topics.filter(t => t.status==='Completed').length;
    learning += sub.topics.filter(t => t.status==='Learning').length;
    revision += sub.topics.filter(t => t.status==='Needs Revision').length;
    notStarted += sub.topics.filter(t => t.status==='Not Started').length;
  }
  const reasons = {};
  DB.getMistakes().forEach(m => { if(m.wrongReason) reasons[m.wrongReason] = (reasons[m.wrongReason]||0)+1; });
  return `
  <div class="section-title">Performance Analytics</div>
  <div class="grid-4 mb-4">
    <div class="stat-card">
      <div class="stat-label">Total Study Time</div>
      <div class="stat-value">${Math.floor(totalMin/60)}h ${totalMin%60}m</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Focus Score</div>
      <div class="stat-value" style="color:${focusScore>=80?'var(--green)':focusScore>=60?'var(--accent)':'var(--red)'}">${focusScore}%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Distractions Logged</div>
      <div class="stat-value">${totalDist}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Sessions Completed</div>
      <div class="stat-value">${logs.length}</div>
    </div>
  </div>

  <div class="grid-2 mb-4">
    <div class="card">
      <div class="font-semibold mb-4">Syllabus Coverage</div>
      ${[['Completed',done,'green'],['Learning',learning,'accent'],['Needs Revision',revision,'yellow'],['Not Started',notStarted,'dim']].map(([label,count,col]) => `
        <div class="mb-3">
          <div class="flex justify-between text-sm mb-1">
            <span>${label}</span>
            <span class="font-semibold">${count} topics (${Math.round(count/totalT*100)}%)</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(count/totalT*100)}%;background:var(--${col==='dim'?'text3':col})"></div></div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="font-semibold mb-4">Mistake Analysis</div>
      ${Object.keys(reasons).length ? Object.entries(reasons).map(([r,c]) => `
        <div class="mb-3">
          <div class="flex justify-between text-sm mb-1">
            <span>${r}</span>
            <span class="font-semibold">${c}</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(c/DB.getMistakes().length*100)}%;background:var(--red)"></div></div>
        </div>`).join('') : '<div class="text-muted text-sm text-center" style="padding:2rem 0">No mistakes logged yet. Practice in PYQ Arena!</div>'}
    </div>
  </div>

  <div class="card">
    <div class="font-semibold mb-4">Subject-wise Performance</div>
    <table>
      <thead><tr><th>Subject</th><th>Progress</th><th>PYQ Attempts</th><th>Accuracy</th><th>Avg Mastery</th></tr></thead>
      <tbody>
        ${Object.entries(st.syllabus).map(([id,sub]) => {
          const d = sub.topics.filter(t=>t.status==='Completed').length;
          const pct = Math.round(d/sub.topics.length*100);
          const att = st.pyqAttempts.filter(a=>a.subId===id).length;

          const acc = att ? Math.round(cor/att*100) : 0;
          const avgM = Math.round(sub.topics.reduce((s,t)=>s+t.mastery,0)/sub.topics.length);
          return `<tr>
            <td class="font-medium">${sub.name}</td>
            <td><div class="flex gap-2 items-center"><span>${pct}%</span><div style="width:80px">${bar(pct,'',3)}</div></div></td>
            <td>${att}</td>
            <td><span style="color:${acc>=70?'var(--green)':acc>=50?'var(--accent)':'var(--red)'}" class="font-bold">${att ? acc+'%' : '—'}</span></td>
            <td>${avgM}%</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

window.saveSettings = function() {
  Object.assign(DB.get().settings, {
    examDate: document.getElementById('set-date').value,
    targetScore: parseFloat(document.getElementById('set-score').value),
    targetRank: parseInt(document.getElementById('set-rank').value),
    dailyHours: parseFloat(document.getElementById('set-hours').value),
    geminiApiKey: document.getElementById('set-key').value.trim()
  });
  DB.save();
  Scheduler.rebalance();
  toast('✅ Settings saved and timetable rebalanced');
  navigate('dashboard');
};

window.exportData = function() {
  const data = JSON.stringify(DB.get());
  const a = document.createElement('a');
  a.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(data);
  a.download = `studytrack_${DB.today()}.json`;
  a.click();
};

window.importData = function(input) {
  const f = input.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (d.settings && d.syllabus) { localStorage.setItem('st_v2', JSON.stringify(d)); location.reload(); }
      else alert('Invalid backup format');
    } catch { alert('Failed to parse JSON'); }
  };
  reader.readAsText(f);
};

window.resetApp = function() {
  if (confirm('This will permanently delete all your study data, logs, and progress. Are you sure?')) {
    localStorage.removeItem('st_v2'); location.reload();
  }
};

  },
  quickStart() {
    const rec = DB.recommend();
    if (rec) {
      startQuickSession(rec.subId, rec.topicId, rec.topicName, rec.type);
    } else {
      navigate('session');
    }
  }
};

window.App = App;
App.init();
</script>
</body>
